# Render Blueprint for a PRIVATE deployment of PAM. Not applied: creating these resources is billable and requires the
# owner's explicit authorization. Secrets are `sync: false` and must be entered in the Render dashboard.
# The intake application (E02) deploys from its own repository's render.yaml.
databases:
  - name: pam-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # private: no public access
services:
  - type: web
    name: pam
    runtime: node
    plan: starter
    buildCommand: npm ci && node scripts/bootstrap-engines.mjs && node src/app/main.ts migrate
    startCommand: node src/app/main.ts serve
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "24.22.2" }
      - { key: HOST, value: 0.0.0.0 }
      - { key: PAM_WORKER, value: "off" }          # work runs in the worker service
      - { key: DATABASE_URL, fromDatabase: { name: pam-db, property: connectionString } }
      - { key: OBJECT_STORE, value: s3 }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: IDENTITY_KEY_ENCRYPTION_KEY, sync: false }
      - { key: EVIDENCE_MASTER_KEY, sync: false }
      - { key: CORRESPONDENCE_SECRET_KEY, sync: false }
      - { key: RELEASE_DOWNLOAD_SECRET, sync: false }
      - { key: PAM_INTAKE_LINKS, sync: false }
  - type: worker
    name: pam-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && node scripts/bootstrap-engines.mjs
    startCommand: node src/app/main.ts worker
    envVars:
      - { key: NODE_VERSION, value: "24.22.2" }
      - { key: DATABASE_URL, fromDatabase: { name: pam-db, property: connectionString } }
      - { fromGroup: pam-secrets }
envVarGroups:
  - name: pam-secrets
    envVars:
      - { key: OBJECT_STORE, value: s3 }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: IDENTITY_KEY_ENCRYPTION_KEY, sync: false }
      - { key: EVIDENCE_MASTER_KEY, sync: false }
      - { key: CORRESPONDENCE_SECRET_KEY, sync: false }
      - { key: PAM_INTAKE_LINKS, sync: false }
# Note: the worker needs system tools (poppler, tesseract, ffmpeg, libreoffice, pandoc, imagemagick, exiftool, sox,
# fluidsynth + GM soundfont, espeak-ng, clamav). Render's native Node runtime does not include them; a Docker-based
# service built from a Dockerfile that installs them is required for processing and production work.
