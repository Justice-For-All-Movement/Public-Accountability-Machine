# Keeps the hosted PAM service (Render free plan) from sleeping, so its worker keeps running between visits.
# The free plan spins a service down after ~15 minutes without inbound requests; GitHub schedules may run a few
# minutes late, so the interval is shorter than that. Read-only: it only requests the public health endpoint.
name: Keep hosted PAM awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health checks (retries while each service wakes)
        # Intake must stay awake too: it is also published as a Tor onion service, which is unreachable while asleep.
        run: |
          ok=0
          for url in https://pam-em80.onrender.com/healthz https://intake-pam.onrender.com/api/ready; do
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 60 -o /dev/null "$url"; then echo "awake: $url"; ok=$((ok+1)); break; fi
              sleep 20
            done
          done
          [ "$ok" -eq 2 ] || { echo "a service did not answer its health check" >&2; exit 1; }
